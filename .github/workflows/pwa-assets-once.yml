name: XRMOVI PWA one-time PNG rasterization
on:
  push:
    branches:
      - feat/20261115-pwa-raster-icons
    paths:
      - .github/workflows/pwa-assets-once.yml
permissions:
  contents: write
jobs:
  rasterize:
    if: github.repository == 'rhianmello/XRMOVI' && github.ref == 'refs/heads/feat/20261115-pwa-raster-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PNGs from unchanged source SVG
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          python scripts/build_pwa_icons.py
          python - <<'PY'
          from PIL import Image
          for name, size in [('icon-192.png',192),('icon-512.png',512),('icon-maskable-512.png',512),('apple-touch-icon.png',180)]:
              with Image.open('pwa/'+name) as im:
                  assert im.format=='PNG' and im.size==(size,size),name
          PY
      - name: Commit rasterized images only to the isolated PWA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/icon-192.png pwa/icon-512.png pwa/icon-maskable-512.png pwa/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Raster assets unchanged"
          else
            git commit -m "assets(pwa): rasterize official SVG brand for Android and iOS"
            git push origin HEAD:refs/heads/feat/20261115-pwa-raster-icons
          fi
