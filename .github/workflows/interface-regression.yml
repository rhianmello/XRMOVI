name: XRMOVI interface and public access
on:
  push:
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'pwa/**', 'theme/**', 'seo/**', 'recursos/**', 'cliente/**', 'widget/**', 'redefinir-senha.html', 'km/**', 'auth/**', 'admin/**', 'analytics/**', 'v3/**', 'termos/**', 'privacidade/**', 'cancelamento/**', 'legal/**', 'tests/**', 'package*.json', '.github/workflows/interface-regression.yml']
  pull_request:
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'pwa/**', 'theme/**', 'seo/**', 'recursos/**', 'cliente/**', 'widget/**', 'redefinir-senha.html', 'km/**', 'auth/**', 'admin/**', 'analytics/**', 'v3/**', 'termos/**', 'privacidade/**', 'cancelamento/**', 'legal/**', 'tests/**', 'package*.json', '.github/workflows/interface-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate light-theme contrast and coverage
        run: node --test tests/clean-light-theme.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser check light backgrounds and mobile layout (offline)
        run: node --test tests/clean-light-browser.test.cjs
      - name: Public authentication and fleet interface (offline mocks)
        run: npm run test:browser
      - name: Audited commercial classification and revenue regression
        run: node --test tests/admin-payment-filters.test.mjs tests/admin-commercial-classification-sql.test.mjs tests/admin-commercial-history.test.mjs tests/admin-auth-mail-guidance.test.mjs tests/marketing-conversions.test.mjs tests/marketing-external-only.test.mjs tests/password-recovery-gate.test.mjs

  capture-public-pages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture real public XRMOVI pages for Google Ads selection
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            fs.mkdirSync('ad-screenshots',{recursive:true});
            const routes=[
              ['01-home','/'],
              ['02-recursos','/recursos/'],
              ['03-exemplos','/exemplos-de-uso/'],
              ['04-abastecimento','/controle-de-abastecimento/'],
              ['05-manutencao','/controle-de-manutencao/'],
              ['06-qr-quilometragem','/controle-quilometragem-qr-code/'],
              ['07-painel','/v3/']
            ];
            for(const [name,route] of routes){
              for(const [format,width,height] of [['horizontal',1440,900],['quadrado',1200,1200]]){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                try{
                  const url='https://xrmovi.com.br'+route;
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  await page.waitForTimeout(1200);
                  const reject=page.getByText('Recusar',{exact:true}).first();
                  if(await reject.count()) await reject.click({timeout:2500}).catch(()=>{});
                  await page.waitForTimeout(500);
                  const title=await page.title();
                  const filename='ad-screenshots/'+name+'-'+format+'.png';
                  await page.screenshot({path:filename,animations:'disabled'});
                  console.log(filename, response?.status(),title,page.url());
                }catch(error){console.log('Capture failed',route,format,String(error));}
                await page.close();
              }
            }
            const demoPage=await browser.newPage({viewport:{width:1440,height:1000}});
            await demoPage.goto('https://xrmovi.com.br/',{waitUntil:'domcontentloaded',timeout:45000});
            await demoPage.waitForTimeout(900);
            await demoPage.locator('[data-demo]').first().click();
            const modal=demoPage.locator('dialog#demo');
            await modal.waitFor({state:'visible',timeout:10000});
            for(const [view,name] of [
              ['overview','08-demo-visao-geral'],
              ['vehicles','09-demo-veiculos'],
              ['maintenance','10-demo-manutencao'],
              ['reports','11-demo-relatorios']
            ]){
              await demoPage.locator('[data-preview="'+view+'"]').click();
              await demoPage.waitForTimeout(350);
              const filename='ad-screenshots/'+name+'.png';
              await modal.screenshot({path:filename,animations:'disabled'});
              console.log(filename,'demo illustrates features, not real customer data');
            }
            await demoPage.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xrmovi-capturas-reais-publicas
          path: ad-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
