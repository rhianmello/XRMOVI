name: XRMOVI free local database verification

on:
  push:
    branches:
      - feat/frota-cobranca-veiculo-teste-24h
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/xrmovi-fleet-local-smoke.sql'
      - 'supabase/tests/xrmovi-ci-baseline.sql'
      - '.github/workflows/xrmovi-local-database.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/xrmovi-ci-baseline.sql'
      - 'supabase/tests/xrmovi-fleet-local-smoke.sql'
      - '.github/workflows/xrmovi-local-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-smoke:
    name: Isolated Supabase database - no production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize isolated local Supabase project
        run: |
          mkdir -p "${RUNNER_TEMP}/xrmovi-db-check"
          cd "${RUNNER_TEMP}/xrmovi-db-check"
          supabase init
          # Existing XRMOVI migrations are incremental and need the production schema.
          # Boot an isolated structural fixture instead of importing customer data.
          mkdir -p supabase/migrations
          cp "${GITHUB_WORKSPACE}/supabase/tests/xrmovi-ci-baseline.sql" supabase/migrations/00000000000000_ci_base.sql
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261112060000_xrmovi_fleet_pricing_trial_24h.sql" supabase/migrations/20261112060000_xrmovi_fleet_pricing_trial_24h.sql

      - name: Start only a local Postgres database and apply migrations
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase db start

      - name: Validate real SQL price quotes, one-time trial and expiry
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "${GITHUB_WORKSPACE}/supabase/tests/xrmovi-fleet-local-smoke.sql"

      - name: Verify migrations installed
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase migration list --local

      - name: Stop local database
        if: always()
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase stop --no-backup || true

# This workflow never links to Supabase production and never uses any production key,
# dashboard credentials, or Mercado Pago credentials. It cannot create real payments.
