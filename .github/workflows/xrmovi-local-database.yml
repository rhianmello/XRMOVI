name: XRMOVI free local database verification

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/xrmovi-local-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-smoke:
    name: Isolated Supabase database - no production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize isolated local Supabase project
        run: |
          mkdir -p "${RUNNER_TEMP}/xrmovi-db-check"
          cd "${RUNNER_TEMP}/xrmovi-db-check"
          supabase init
          cp -R "${GITHUB_WORKSPACE}/supabase/migrations" supabase/migrations

      - name: Start only a local Postgres database and apply migrations
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase db start

      - name: Verify migrations installed
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase migration list --local

      - name: Stop local database
        if: always()
        working-directory: ${{ runner.temp }}/xrmovi-db-check
        run: |
          supabase stop --no-backup || true

# This workflow never links to Supabase production and never uses any production key,
# dashboard credentials, or Mercado Pago credentials. It cannot create real payments.
