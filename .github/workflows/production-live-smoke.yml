name: XRMOVI production HTTPS and mobile smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-live-smoke.yml'
      - 'tests/production-live-smoke.live.cjs'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: xrmovi-production-smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Inspect live public pages on HTTPS (no payments, no login)
        run: node --test --test-concurrency=1 tests/production-live-smoke.live.cjs
